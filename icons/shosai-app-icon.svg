  <title id="t">制作の書斎</title>
  <desc id="d">暗い資料の背表紙が並ぶ棚に、生成りの紙の背表紙を一本だけ立て、縦書き明朝の「書斎」と栞を置いた印</desc>
  <!-- 意匠の根拠: style.css 冒頭「書斎らしさは木目や革の模倣ではなく、背表紙の縦書きと明朝の問いで作る」。
       暗い机の色＝資料・根拠の側、生成りの紙＝本人の制作の側。字形は tools/make_app_icon.swift が
       ヒラギノ明朝 ProN W6 からパスとして書き出したもの（フォントに依存しない）。 -->

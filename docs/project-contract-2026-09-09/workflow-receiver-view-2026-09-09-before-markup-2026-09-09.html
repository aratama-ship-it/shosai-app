<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>舞台スケッチ｜現場Qビュー</title>
<style>
:root{--desk:#201b16;--paper:#efe7d6;--page:#fffaf0;--ink:#2b2620;--muted:#6a604e;--line:#c7b99f;--accent:#8f3e1e;--sound:#315a70;--move:#4e5e38;--stage:#644565;--touch:44px;--panel:440px}*{box-sizing:border-box}body{min-height:100dvh;margin:0;background:var(--desk);color:var(--ink);font:15px/1.55 "Hiragino Sans","Yu Gothic",system-ui,sans-serif}button,select{font:inherit;color:inherit}button:focus-visible,select:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.receiver{width:min(1320px,calc(100% - 40px));height:min(920px,calc(100dvh - 40px));display:grid;grid-template-rows:auto minmax(0,1fr);margin:20px auto;background:var(--page);border-top:3px solid var(--accent);box-shadow:0 14px 40px #0008}.appbar{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,360px);gap:18px;padding:14px 18px;border-bottom:1px solid var(--line)}.eyebrow{margin:0;color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.05em}.appbar h1{margin:2px 0 0;font-size:21px;line-height:1.3}.appbar .note{margin:4px 0 0;color:var(--muted);font-size:12px}.viewer-select{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:center;color:var(--muted);font-size:12px}.viewer-select select{width:100%;min-height:var(--touch);padding:0 8px;border:1px solid var(--line);border-radius:0;background:var(--page);color:var(--ink)}.split{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) var(--panel)}.stage-area{min-height:0;overflow:auto;padding:18px;border-right:1px solid var(--line);background:var(--paper)}.current-bar{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding-bottom:12px;border-bottom:1px solid var(--line)}.current-bar h2{margin:0;font-size:20px;line-height:1.4}.current-bar p{margin:0;color:var(--muted);font-size:12px}.stage-map{position:relative;min-height:320px;margin-top:16px;overflow:hidden;border:2px solid var(--ink);background:var(--desk);color:var(--paper)}.stage-map::before{content:"";position:absolute;inset:20px 18px 18px;border:1px solid #75664f;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(25% - 1px),#75664f 25%);opacity:.78}.stage-map::after{content:"客席";position:absolute;right:18px;bottom:0;color:#ddc58d;font-size:12px}.stage-upstage{position:absolute;left:18px;top:0;color:#ddc58d;font-size:12px}.stage-piece{position:absolute;z-index:1;display:grid;place-items:center;transform:translate(-50%,-50%);border:2px solid var(--page);color:var(--page);font-size:12px;font-weight:800}.stage-piece.is-performer{width:34px;height:34px;border-radius:50%;background:var(--stage)}.stage-piece.is-set{width:68px;min-height:30px;padding:3px 5px;background:var(--move);border-radius:0}.stage-brief{display:grid;grid-template-columns:150px minmax(0,1fr);gap:0;margin-top:16px;border-top:2px solid var(--ink)}.stage-brief dt,.stage-brief dd{margin:0;padding:9px 0;border-bottom:1px solid var(--line)}.stage-brief dt{color:var(--muted);font-size:12px}.stage-brief dd{font-size:14px}.cue-rail{display:flex;gap:0;margin-top:18px;overflow:auto;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.cue-rail button{position:relative;flex:1 0 92px;min-height:68px;padding:8px;border:0;border-right:1px solid var(--line);background:transparent;text-align:left;cursor:pointer}.cue-rail button:hover,.cue-rail button[aria-pressed="true"]{background:var(--page)}.cue-rail button[aria-pressed="true"]::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent)}.cue-rail strong{display:block;font-size:14px}.cue-rail span{display:block;color:var(--muted);font-size:11px}.operator{min-height:0;display:flex;flex-direction:column;background:var(--page)}.operator-head{padding:16px;border-bottom:1px solid var(--line)}.operator-head h2{margin:2px 0 0;font-size:20px;line-height:1.35}.operator-head p{margin:5px 0 0;color:var(--muted);font-size:12px}.cue-nav{display:grid;grid-template-columns:var(--touch) minmax(0,1fr) var(--touch);gap:6px;margin-top:12px}.cue-nav button{min-height:var(--touch);border:1px solid var(--line);background:transparent;cursor:pointer;font-size:18px}.cue-nav output{display:flex;align-items:center;justify-content:center;min-height:var(--touch);padding:4px;border-bottom:2px solid var(--accent);font-size:13px;font-weight:800}.operator-body{min-height:0;overflow:auto;padding:0 16px 16px}.task{padding:14px 0;border-bottom:1px solid var(--line)}.task h3{margin:0;font-size:16px;line-height:1.4}.task p{margin:5px 0 0;color:var(--muted);font-size:13px}.task .is-direct{color:var(--accent);font-weight:800}.warning{margin:12px 0 0;padding:9px 10px;border-left:3px solid var(--accent);background:var(--paper);font-size:12px}.warning strong{color:var(--accent)}.checklist{display:grid;gap:0;margin:12px 0 0;border-top:1px solid var(--line)}.checklist label{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;align-items:center;min-height:44px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer}.checklist input{width:18px;height:18px;accent-color:var(--accent)}.neighbors{margin-top:14px;border-top:2px solid var(--ink)}.neighbors h3{margin:9px 0;font-size:14px}.neighbor{display:grid;grid-template-columns:55px minmax(0,1fr);gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:12px}.neighbor strong{font-variant-numeric:tabular-nums}.neighbor p{margin:0;color:var(--muted)}.operator-foot{margin-top:auto;padding:10px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:11px}.links{display:flex;gap:12px;margin-top:10px}.links a{color:var(--accent);font-size:12px;text-underline-offset:3px}.error{margin:16px;padding:12px;border-left:3px solid var(--accent);background:var(--paper)}@media(max-width:900px){.receiver{width:100%;height:100dvh;margin:0;border-top:0}.appbar{grid-template-columns:1fr}.split{grid-template-columns:1fr;overflow:auto}.stage-area{border-right:0;border-bottom:1px solid var(--line)}.operator{min-height:720px}.stage-map{min-height:280px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
.memo{margin-top:16px;padding-top:12px;border-top:2px solid var(--ink)}.memo-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline}.memo-head h3{margin:1px 0 0;font-size:15px}.memo-scope{color:var(--muted);font-size:11px;white-space:nowrap}.memo textarea{display:block;width:100%;min-height:112px;margin-top:10px;padding:9px 10px;resize:vertical;border:1px solid var(--line);border-radius:0;background:var(--page);color:var(--ink);font:14px/1.55 "Hiragino Sans","Yu Gothic",system-ui,sans-serif}.memo textarea::placeholder{color:var(--muted)}.memo-actions{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-top:8px}.memo-actions button{min-height:var(--touch);padding:0 11px;border:1px solid var(--accent);background:var(--accent);color:var(--page);font-weight:800;cursor:pointer}.memo-actions button+button{background:transparent;color:var(--accent)}.memo-status{margin:7px 0 0;color:var(--muted);font-size:11px}.scene-memo{margin-bottom:18px}.cue-memo{padding-bottom:14px;border-bottom:1px solid var(--line)}.stage-toolbar{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.stage-toolbar button,.annotation-editor button,.annotation-list button{min-height:var(--touch);padding:0 10px;border:1px solid var(--line);border-radius:0;background:var(--page);color:var(--ink);font-weight:800;cursor:pointer}.stage-toolbar button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--page)}.stage-toolbar button:disabled,.annotation-editor button:disabled{cursor:not-allowed;opacity:.5}.annotation-help,.annotation-status{margin:7px 0 0;color:var(--muted);font-size:11px}.annotation-editor{margin-top:10px;padding:10px;border-left:3px solid var(--accent);background:var(--page)}.annotation-editor h3{margin:0;font-size:14px}.annotation-editor textarea{display:block;width:100%;min-height:76px;margin-top:8px;padding:8px;border:1px solid var(--line);border-radius:0;background:var(--page);color:var(--ink);font:13px/1.5 "Hiragino Sans","Yu Gothic",system-ui,sans-serif}.annotation-editor-actions{display:flex;justify-content:flex-end;gap:6px;margin-top:8px}.annotation-list{display:grid;gap:0;margin-top:10px;border-top:1px solid var(--line)}.annotation-list button{display:grid;grid-template-columns:50px minmax(0,1fr);gap:8px;width:100%;min-height:40px;border-width:0 0 1px;text-align:left;font-size:12px}.annotation-list button[aria-pressed="true"]{color:var(--accent)}.stage-annotation-layer{position:absolute;z-index:3;inset:0;width:100%;height:100%;pointer-events:none}.stage-annotation-arrow{fill:none;stroke:#ddc58d;stroke-width:3;marker-end:url(#annotation-arrowhead)}.stage-annotation-note{position:absolute;z-index:4;display:block;max-width:110px;padding:4px 6px;border:1px solid var(--accent);background:var(--page);color:var(--ink);box-shadow:2px 2px 0 #201b16;font:12px/1.35 "Hiragino Sans","Yu Gothic",system-ui,sans-serif;text-align:left;cursor:pointer}.stage-annotation-note.is-selected{outline:3px solid #ddc58d;outline-offset:2px}.stage-map[data-annotation-tool="arrow"]{cursor:crosshair}.stage-map[data-annotation-tool="note"]{cursor:copy}
</style>
</head>
<body>
<main class="receiver" aria-labelledby="title">
<header class="appbar"><div><p class="eyebrow">Q VIEW / 現場で見る</p><h1 id="title">舞台の状況と自分の操作</h1><p class="note">架空fixtureの読み取り専用画面。GO送信・共有状態・実行記録は扱いません。</p></div><label class="viewer-select" for="recipient"><span>見る人</span><select id="recipient" aria-label="見る人を切り替える"></select></label></header>
<div id="split" class="split"><section class="stage-area" aria-labelledby="stage-title"><header class="current-bar"><div><p class="eyebrow">舞台の状況</p><h2 id="stage-title">読み込み中</h2></div><p id="stage-time"></p></header><div id="stage-map" class="stage-map" aria-label="現在の架空舞台配置"><span class="stage-upstage">奥</span></div><section class="stage-markup" aria-labelledby="markup-title"><header class="memo-head"><div><p class="eyebrow">舞台への書き込み</p><h3 id="markup-title">自分の配置レイヤー</h3></div><span class="memo-scope">このブラウザだけ</span></header><div class="stage-toolbar" role="group" aria-label="舞台へ書き込む道具"><button type="button" data-annotation-tool="select" aria-pressed="true">選択</button><button type="button" data-annotation-tool="arrow" aria-pressed="false">矢印</button><button type="button" data-annotation-tool="note" aria-pressed="false">付箋</button></div><p id="annotation-help" class="annotation-help">選択した配置メモを確認・消去できます。</p><div class="annotation-editor"><h3 id="annotation-editor-title">配置メモを選択</h3><textarea id="annotation-copy" aria-label="配置メモの内容" placeholder="付箋を舞台に置くと、ここで内容を書けます。" disabled></textarea><div class="annotation-editor-actions"><button id="annotation-delete" type="button" disabled>選択を消去</button></div></div><div id="annotation-list" class="annotation-list" aria-label="このシーンの配置メモ"></div><p id="annotation-status" class="annotation-status" role="status" aria-live="polite"></p></section><dl id="stage-brief" class="stage-brief"></dl><section class="memo scene-memo" aria-labelledby="scene-memo-title"><header class="memo-head"><div><p class="eyebrow">シーン内のメモ</p><h3 id="scene-memo-title">シーンメモ</h3></div><span class="memo-scope">このブラウザだけ</span></header><textarea id="scene-memo" aria-label="シーンメモ" placeholder="このシーンで確認したいことを書く"></textarea><div class="memo-actions"><button id="scene-memo-save" type="button">保存</button><button id="scene-memo-clear" type="button">消去</button></div><p id="scene-memo-status" class="memo-status" role="status" aria-live="polite"></p></section><nav id="cue-rail" class="cue-rail" aria-label="Qの前後関係"></nav></section><aside class="operator" aria-labelledby="operator-title"><header class="operator-head"><p class="eyebrow">自分のQシート</p><h2 id="operator-title">読み込み中</h2><p id="operator-subtitle"></p><div class="cue-nav"><button id="previous" type="button" aria-label="前のQ">‹</button><output id="current-cue" for="previous next"></output><button id="next" type="button" aria-label="次のQ">›</button></div></header><div id="operator-body" class="operator-body"><section class="task" aria-labelledby="task-title"><p class="eyebrow">いま見ること</p><h3 id="task-title"></h3><p id="task-copy"></p><div id="warning"></div><div id="checklist" class="checklist"></div></section><section class="memo cue-memo" aria-labelledby="cue-memo-title"><header class="memo-head"><div><p class="eyebrow">Qシート側のメモ</p><h3 id="cue-memo-title">Qメモ</h3></div><span class="memo-scope">このブラウザだけ</span></header><textarea id="cue-memo" aria-label="Qシートメモ" placeholder="このQで確認したいことを書く"></textarea><div class="memo-actions"><button id="cue-memo-save" type="button">保存</button><button id="cue-memo-clear" type="button">消去</button></div><p id="cue-memo-status" class="memo-status" role="status" aria-live="polite"></p></section><section class="neighbors" aria-labelledby="neighbor-title"><h3 id="neighbor-title">このQの前後</h3><div id="neighbors"></div></section><nav class="links" aria-label="関連画面"><a href="workflow-delivery-hub-2026-09-09.html">配布ハブ</a><a href="workflow-timeline-view-2026-09-09.html?delivery=1">全体タイムライン</a></nav></div><footer id="operator-foot" class="operator-foot"></footer></aside></div>
<p id="load-error" class="error" hidden></p>
</main>

<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-labelledby="title description" data-frame="RJ-COND-03-C-02" data-view="plan"><title id="title">傷を見て、即座に報復／平面図</title><desc id="description">ベンヴォーリオが負傷した友を支える。その傷を見たロミオが、間を置かずティボルトへ向かう。 位置は検討案。左は客席から見た左、下側は客席。</desc><rect width="1100" height="680" fill="#fffaf0"/><defs><clipPath id="floor"><polygon points="140.0,105.0 960.0,105.0 960.0,545.0 140.0,545.0"/></clipPath><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1L9 5L0 9" fill="none" stroke="#75664f" stroke-width="1.5"/></marker></defs><g font-family="Hiragino Kaku Gothic ProN,Yu Gothic,sans-serif"><text x="36.0" y="40.0" font-size="18" fill="#2b2620" text-anchor="start" >平面図 · 配置検討</text><polygon points="140.0,105.0 960.0,105.0 960.0,545.0 140.0,545.0" fill="#ddd2bc" stroke="#75664f" stroke-width="2"/><g clip-path="url(#floor)"></g><path d="M140,545 L960,545" stroke="#75664f" stroke-width="4"/><text x="550.0" y="610.2" font-size="23" fill="#2b2620" text-anchor="middle" font-weight="700">客席側</text><text x="60.0" y="588.0" font-size="16" fill="#2b2620" text-anchor="start" >客席から見て左</text><text x="1040.0" y="588.0" font-size="16" fill="#2b2620" text-anchor="end" >客席から見て右</text><text x="550.0" y="49.0" font-size="17" fill="#2b2620" text-anchor="middle" >舞台奥</text><path class="route" d="M591.0,325.0 L673.0,325.0" fill="none" stroke="#75664f" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/><g class="person" data-performer="ROMEO" data-character="ROMEO" data-state="" data-u="0.55" data-v="0.5" data-pose="reach"><title>ロミオ</title><circle cx="591.0" cy="325.0" r="21" fill="#8f3e1e" stroke="#fffaf0" stroke-width="3"/><text x="591.0" y="332.0" font-size="19" fill="#fffaf0" text-anchor="middle" font-weight="700">Ro</text><path class="facing" d="M618.0,325.0l12.0,0.0" stroke="#8f3e1e" stroke-width="3" stroke-linecap="round"/></g><g class="person" data-performer="TYBALT" data-character="TYBALT" data-state="" data-u="0.76" data-v="0.5" data-pose="reach"><title>ティボルト</title><circle cx="763.2" cy="325.0" r="21" fill="#245963" stroke="#fffaf0" stroke-width="3"/><text x="763.2" y="332.0" font-size="19" fill="#fffaf0" text-anchor="middle" font-weight="700">Ty</text><path class="facing" d="M736.2,325.0l-12.0,0.0" stroke="#245963" stroke-width="3" stroke-linecap="round"/></g><g class="person" data-performer="MERCUTIO" data-character="MERCUTIO" data-state="負傷" data-u="0.28" data-v="0.62" data-pose="kneel"><title>マーキューシオ／負傷</title><circle cx="369.6" cy="377.8" r="21" fill="#8f3e1e" stroke="#fffaf0" stroke-width="3"/><text x="369.6" y="384.8" font-size="19" fill="#fffaf0" text-anchor="middle" font-weight="700">Me</text><path class="facing" d="M369.6,404.8l0.0,12.0" stroke="#8f3e1e" stroke-width="3" stroke-linecap="round"/></g><g class="person" data-performer="BENVOLIO" data-character="BENVOLIO" data-state="" data-u="0.15" data-v="0.69" data-pose="reach"><title>ベンヴォーリオ</title><circle cx="263.0" cy="408.59999999999997" r="21" fill="#8f3e1e" stroke="#fffaf0" stroke-width="3"/><text x="263.0" y="415.6" font-size="19" fill="#fffaf0" text-anchor="middle" font-weight="700">Be</text><path class="facing" d="M290.0,408.59999999999997l12.0,0.0" stroke="#8f3e1e" stroke-width="3" stroke-linecap="round"/></g><text x="36.0" y="643.0" font-size="16" fill="#2b2620" text-anchor="start" >位置・舞台寸法は検討案。破線の矢印＝移動案／短い線＝向き。</text><text x="1064.0" y="643.0" font-size="17" fill="#2b2620" text-anchor="end" >舞台上 4名</text></g></svg>
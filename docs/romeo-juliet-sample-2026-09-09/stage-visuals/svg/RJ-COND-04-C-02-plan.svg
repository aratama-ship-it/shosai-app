<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-labelledby="title description" data-frame="RJ-COND-04-C-02" data-view="plan"><title id="title">葬送を見かける／平面図</title><desc id="description">死んだと思い込む乳母と父。寝室から葬送の道へ場を移し、ベンヴォーリオがそれを目にする。 位置は検討案。左は客席から見た左、下側は客席。</desc><rect width="1100" height="680" fill="#fffaf0"/><defs><clipPath id="floor"><polygon points="140.0,105.0 960.0,105.0 960.0,545.0 140.0,545.0"/></clipPath><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1L9 5L0 9" fill="none" stroke="#75664f" stroke-width="1.5"/></marker></defs><g font-family="Hiragino Kaku Gothic ProN,Yu Gothic,sans-serif"><text x="36.0" y="40.0" font-size="18" fill="#2b2620" text-anchor="start" >平面図 · 配置検討</text><polygon points="140.0,105.0 960.0,105.0 960.0,545.0 140.0,545.0" fill="#ddd2bc" stroke="#75664f" stroke-width="2"/><g clip-path="url(#floor)"></g><path d="M140,545 L960,545" stroke="#75664f" stroke-width="4"/><text x="550.0" y="610.2" font-size="23" fill="#2b2620" text-anchor="middle" font-weight="700">客席側</text><text x="60.0" y="588.0" font-size="16" fill="#2b2620" text-anchor="start" >客席から見て左</text><text x="1040.0" y="588.0" font-size="16" fill="#2b2620" text-anchor="end" >客席から見て右</text><text x="550.0" y="49.0" font-size="17" fill="#2b2620" text-anchor="middle" >舞台奥</text><g class="person" data-performer="CAPULET" data-character="CAPULET" data-state="" data-u="0.88" data-v="0.38" data-pose="stand"><title>キャピュレット</title><circle cx="861.6" cy="272.2" r="21" fill="#245963" stroke="#fffaf0" stroke-width="3"/><text x="861.6" y="279.2" font-size="19" fill="#fffaf0" text-anchor="middle" font-weight="700">Ca</text><path class="facing" d="M861.6,299.2l0.0,12.0" stroke="#245963" stroke-width="3" stroke-linecap="round"/></g><g class="person" data-performer="JULIET" data-character="JULIET" data-state="仮死" data-u="0.78" data-v="0.63" data-pose="lie"><title>ジュリエット／仮死</title><circle cx="779.6" cy="382.2" r="21" fill="#245963" stroke="#fffaf0" stroke-width="3"/><text x="779.6" y="389.2" font-size="19" fill="#fffaf0" text-anchor="middle" font-weight="700">Ju</text></g><g class="person" data-performer="NURSE" data-character="NURSE" data-state="" data-u="0.59" data-v="0.66" data-pose="kneel"><title>乳母</title><circle cx="623.8" cy="395.40000000000003" r="21" fill="#245963" stroke="#fffaf0" stroke-width="3"/><text x="623.8" y="402.4" font-size="19" fill="#fffaf0" text-anchor="middle" font-weight="700">Nu</text><path class="facing" d="M623.8,422.40000000000003l0.0,12.0" stroke="#245963" stroke-width="3" stroke-linecap="round"/></g><g class="person" data-performer="BENVOLIO" data-character="BENVOLIO" data-state="" data-u="0.24" data-v="0.68" data-pose="stand"><title>ベンヴォーリオ</title><circle cx="336.79999999999995" cy="404.20000000000005" r="21" fill="#8f3e1e" stroke="#fffaf0" stroke-width="3"/><text x="336.8" y="411.2" font-size="19" fill="#fffaf0" text-anchor="middle" font-weight="700">Be</text><path class="facing" d="M336.79999999999995,431.20000000000005l0.0,12.0" stroke="#8f3e1e" stroke-width="3" stroke-linecap="round"/></g><text x="36.0" y="643.0" font-size="16" fill="#2b2620" text-anchor="start" >位置・舞台寸法は検討案。破線の矢印＝移動案／短い線＝向き。</text><text x="1064.0" y="643.0" font-size="17" fill="#2b2620" text-anchor="end" >舞台上 4名</text></g></svg>
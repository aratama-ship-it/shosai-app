<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-labelledby="title description" data-frame="RJ-COND-03-D-01" data-view="plan"><title id="title">追放の知らせ／平面図</title><desc id="description">二人の死の後、時間を進めてベンヴォーリオが追放の判決を伝える。 位置は検討案。左は客席から見た左、下側は客席。</desc><rect width="1100" height="680" fill="#fffaf0"/><defs><clipPath id="floor"><polygon points="140.0,105.0 960.0,105.0 960.0,545.0 140.0,545.0"/></clipPath><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1L9 5L0 9" fill="none" stroke="#75664f" stroke-width="1.5"/></marker></defs><g font-family="Hiragino Kaku Gothic ProN,Yu Gothic,sans-serif"><text x="36.0" y="40.0" font-size="18" fill="#2b2620" text-anchor="start" >平面図 · 配置検討</text><polygon points="140.0,105.0 960.0,105.0 960.0,545.0 140.0,545.0" fill="#ddd2bc" stroke="#75664f" stroke-width="2"/><g clip-path="url(#floor)"></g><path d="M140,545 L960,545" stroke="#75664f" stroke-width="4"/><text x="550.0" y="610.2" font-size="23" fill="#2b2620" text-anchor="middle" font-weight="700">客席側</text><text x="60.0" y="588.0" font-size="16" fill="#2b2620" text-anchor="start" >客席から見て左</text><text x="1040.0" y="588.0" font-size="16" fill="#2b2620" text-anchor="end" >客席から見て右</text><text x="550.0" y="49.0" font-size="17" fill="#2b2620" text-anchor="middle" >舞台奥</text><g class="person" data-performer="BENVOLIO" data-character="BENVOLIO" data-state="" data-u="0.4" data-v="0.57" data-pose="stand"><title>ベンヴォーリオ</title><circle cx="468.0" cy="355.79999999999995" r="21" fill="#8f3e1e" stroke="#fffaf0" stroke-width="3"/><text x="468.0" y="362.8" font-size="19" fill="#fffaf0" text-anchor="middle" font-weight="700">Be</text><path class="facing" d="M495.0,355.79999999999995l12.0,0.0" stroke="#8f3e1e" stroke-width="3" stroke-linecap="round"/></g><g class="person" data-performer="ROMEO" data-character="ROMEO" data-state="" data-u="0.64" data-v="0.57" data-pose="stand"><title>ロミオ</title><circle cx="664.8" cy="355.79999999999995" r="21" fill="#8f3e1e" stroke="#fffaf0" stroke-width="3"/><text x="664.8" y="362.8" font-size="19" fill="#fffaf0" text-anchor="middle" font-weight="700">Ro</text><path class="facing" d="M637.8,355.79999999999995l-12.0,0.0" stroke="#8f3e1e" stroke-width="3" stroke-linecap="round"/></g><text x="36.0" y="643.0" font-size="16" fill="#2b2620" text-anchor="start" >位置・舞台寸法は検討案。破線の矢印＝移動案／短い線＝向き。</text><text x="1064.0" y="643.0" font-size="17" fill="#2b2620" text-anchor="end" >舞台上 2名</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-labelledby="title description" data-frame="RJ-COND-04-D-01" data-view="iso"><title id="title">誤った死の知らせが届く／斜め図</title><desc id="description">マントヴァでベンヴォーリオが伝えるのは死の知らせだけ。ロミオは仮死の計画を知らない。 位置は検討案。左は客席から見た左、下側は客席。</desc><rect width="1100" height="680" fill="#fffaf0"/><defs><clipPath id="floor"><polygon points="160.0,240.0 860.0,95.0 1020.0,380.0 320.0,525.0"/></clipPath><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1L9 5L0 9" fill="none" stroke="#75664f" stroke-width="1.5"/></marker></defs><g font-family="Hiragino Kaku Gothic ProN,Yu Gothic,sans-serif"><text x="36.0" y="40.0" font-size="18" fill="#2b2620" text-anchor="start" >斜め図 · 配置検討</text><polygon points="160.0,240.0 320.0,525.0 320.0,549.0 160.0,264.0" fill="#c5b79c" stroke="#75664f" stroke-width="2"/><polygon points="320.0,525.0 1020.0,380.0 1020.0,404.0 320.0,549.0" fill="#c5b79c" stroke="#75664f" stroke-width="2"/><polygon points="160.0,240.0 860.0,95.0 1020.0,380.0 320.0,525.0" fill="#ddd2bc" stroke="#75664f" stroke-width="2"/><g clip-path="url(#floor)"></g><path d="M320,525 L1020,380" stroke="#75664f" stroke-width="4"/><text x="713.2" y="537.5" font-size="23" fill="#2b2620" text-anchor="middle" font-weight="700">客席側</text><text x="60.0" y="588.0" font-size="16" fill="#2b2620" text-anchor="start" >客席から見て左</text><text x="1040.0" y="588.0" font-size="16" fill="#2b2620" text-anchor="end" >客席から見て右</text><text x="510.0" y="111.5" font-size="17" fill="#2b2620" text-anchor="middle" >舞台奥</text><g class="person" data-performer="ROMEO" data-character="ROMEO" data-state="" data-u="0.58" data-v="0.52" data-pose="stand"><title>ロミオ</title><ellipse cx="649.2" cy="307.1" rx="20" ry="7" fill="#2b2620" opacity=".14"/><path d="M649.2,279.1L649.2,295.1 M649.2,295.1L640.2,305.1 M649.2,295.1L658.2,305.1 M636.2,291.1L649.2,283.1L662.2,291.1" stroke="#
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-labelledby="title description" data-frame="RJ-COND-03-D-02" data-view="plan"><title id="title">一夜を過ごした二人の別れ／平面図</title><desc id="description">新婚の二人が密かに過ごした一夜。夜明けにロミオはマントヴァへ去り、ジュリエットが右に残る。 位置は検討案。左は客席から見た左、下側は客席。</desc><rect width="1100" height="680" fill="#fffaf0"/><defs><clipPath id="floor"><polygon points="140.0,105.0 960.0,105.0 960.0,545.0 140.0,545.0"/></clipPath><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1L9 5L0 9" fill="none" stroke="#75664f" stroke-width="1.5"/></marker></defs><g font-family="Hiragino Kaku Gothic ProN,Yu Gothic,sans-serif"><text x="36.0" y="40.0" font-size="18" fill="#2b2620" text-anchor="start" >平面図 · 配置検討</text><polygon points="140.0,105.0 960.0,105.0 960.0,545.0 140.0,545.0" fill="#ddd2bc" stroke="#75664f" stroke-width="2"/><g clip-path="url(#floor)"><polygon points="951.8,457.0 950.9,465.2 948.3,473.3 944.0,481.3 938.1,489.0 930.5,496.4 921.4,503.4 910.9,510.0 899.0,516.1 885.8,521.6 871.6,526.5 856.4,530.7 840.4,534.2 823.8,537.0 806.6,539.0 789.1,540.2 771.4,540.6 753.7,540.2 736.2,539.0 719.0,537.0 702.4,534.2 686.4,530.7 671.2,526.5 657.0,521.6 643.8,516.1 631.9,510.0 621.4,503.4 612.3,496.4 604.7,489.0 598.8,481.3 594.5,473.3 591.9,465.2 591.0,457.0 591.9,448.8 594.5,440.7 598.8,432.7 604.7,425.0 612.3,417.6 621.4,410.6 631.9,404.0 643.8,397.9 657.0,392.4 671.2,387.5 686.4,383.3 702.4,379.8 719.0,377.0 736.2,375.0 753.7,373.8 771.4,373.4 789.1,373.8 806.6,375.0 823.8,377.0 840.4,379.8 856.4,383.3 871.6,387.5 885.8,392.4 899.0,397.9 910.9,404.0 921.4,410.6 930.5,417.6 938.1,425.0 944.0,432.7 948.3,440.7 950.9,448.8" fill="#fffaf0" opacity=".7"/></g><path d="M140,545 L960,545" stroke="#75664f" stroke-width="4"/><text x="550.0" y="610.2" font-size="23" fill="#2b2620" text-anchor="middle" font-weight="700">客席側</text><text x="60.0" y="588.0" font-size="16" fill="#2b2620" text-anchor="start" >客席から見て左</text><text x="1040.0" y="588.0" font-size="16" fill="#2b2620" text-anchor="end" >客席から見て右</text><text x="550.0" y="49.0" font-size="17" fill="#2b2620" text-anchor="middle" >舞台奥</text><path class="route" d="M689.4,457.0 L427.0,501.0" fill="none" stroke="#75664f" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/><g class="person" data-performer="ROMEO" data-character="ROMEO" data-state="" data-u="0.67" data-v="0.8" data-pose="walk"><title>ロミオ</title><circle cx="689.4" cy="457.0" r="21" fill="#8f3e1e" stroke="#fffaf0" stroke-width="3"/><text x="689.4" y="464.0" font-size="19" fill="#fffaf0" text-anchor="middle" font-weight="700">Ro</text><path class="facing" d="M662.4,457.0l-12.0,0.0" stroke="#8f3e1e" stroke-width="3" stroke-linecap="round"/></g><g class="person" data-performer="JULIET" data-character="JULIET" data-state="" data-u="0.86" data-v="0.8" data-pose="reach"><title>ジュリエット</title><circle cx="845.2" cy="457.0" r="21" fill="#245963" stroke="#fffaf0" stroke-width="3"/><text x="845.2" y="464.0" font-size="19" fill="#fffaf0" text-anchor="middle" font-weight="700">Ju</text><path class="facing" d="M818.2,457.0l-12.0,0.0" stroke="#245963" stroke-width="3" stroke-linecap="round"/></g><text x="36.0" y="643.0" font-size="16" fill="#2b2620" text-anchor="start" >位置・舞台寸法は検討案。破線の矢印＝移動案／短い線＝向き。</text><text x="1064.0" y="643.0" font-size="17" fill="#2b2620" text-anchor="end" >舞台上 2名</text></g></svg>
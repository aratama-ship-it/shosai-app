<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-labelledby="title description" data-frame="RJ-COND-03-C-03" data-view="plan"><title id="title">二人が倒れる／平面図</title><desc id="description">ティボルトが倒れ、マーキューシオも力を失う。死亡を知らせる別の場面は挟まない。 位置は検討案。左は客席から見た左、下側は客席。</desc><rect width="1100" height="680" fill="#fffaf0"/><defs><clipPath id="floor"><polygon points="140.0,105.0 960.0,105.0 960.0,545.0 140.0,545.0"/></clipPath><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1L9 5L0 9" fill="none" stroke="#75664f" stroke-width="1.5"/></marker></defs><g font-family="Hiragino Kaku Gothic ProN,Yu Gothic,sans-serif"><text x="36.0" y="40.0" font-size="18" fill="#2b2620" text-anchor="start" >平面図 · 配置検討</text><polygon points="140.0,105.0 960.0,105.0 960.0,545.0 140.0,545.0" fill="#ddd2bc" stroke="#75664f" stroke-width="2"/><g clip-path="url(#floor)"></g><path d="M140,545 L960,545" stroke="#75664f" stroke-width="4"/><text x="550.0" y="610.2" font-size="23" fill="#2b2620" text-anchor="middle" font-weight="700">客席側</text><text x="60.0" y="588.0" font-size="16" fill="#2b2620" text-anchor="start" >客席から見て左</text><text x="1040.0" y="588.0" font-size="16" fill="#2b2620" text-anchor="end" >客席から見て右</text><text x="550.0" y="49.0" font-size="17" fill="#2b2620" text-anchor="middle" >舞台奥</text><g class="person" data-performer="ROMEO" data-character="ROMEO" data-state="" data-u="0.56" data-v="0.48" data-pose="stand"><title>ロミオ</title><circle cx="599.2" cy="316.2" r="21" fill="#8f3e1e" stroke="#fffaf0" stroke-width="3"/><text x="599.2" y="323.2" font-size="19" fill="#fffaf0" text-anchor="middle" font-weight="700">Ro</text><path class="facing" d="M599.2,343.2l0.0,12.0" stroke="#8f3e1e" stroke-width="3" stroke-linecap="round"/></g><g class="person" data-performer="TYBALT" data-character="TYBALT" data-state="死" data-u="0.79" data-v="0.62" data-pose="lie"><title>ティボルト／死</title><ci
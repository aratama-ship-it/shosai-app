<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-labelledby="title description" data-frame="RJ-COND-04-B-02" data-view="plan"><title id="title">計画の手紙をジョンへ／平面図</title><desc id="description">ジュリエットが去ってから、ロレンスは書いた手紙をジョンに託す。 位置は検討案。左は客席から見た左、下側は客席。</desc><rect width="1100" height="680" fill="#fffaf0"/><defs><clipPath id="floor"><polygon points="140.0,105.0 960.0,105.0 960.0,545.0 140.0,545.0"/></clipPath><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1L9 5L0 9" fill="none" stroke="#75664f" stroke-width="1.5"/></marker></defs><g font-family="Hiragino Kaku Gothic ProN,Yu Gothic,sans-serif"><text x="36.0" y="40.0" font-size="18" fill="#2b2620" text-anchor="start" >平面図 · 配置検討</text><polygon points="140.0,105.0 960.0,105.0 960.0,545.0 140.0,545.0" fill="#ddd2bc" stroke="#75664f" stroke-width="2"/><g clip-path="url(#floor)"></g><path d="M140,545 L960,545" stroke="#75664f" stroke-width="4"/><text x="550.0" y="610.2" font-size="23" fill="#2b2620" text-anchor="middle" font-weight="700">客席側</text><text x="60.0" y="588.0" font-size="16" fill="#2b2620" text-anchor="start" >客席から見て左</text><text x="1040.0" y="588.0" font-size="16" fill="#2b2620" text-anchor="end" >客席から見て右</text><text x="550.0" y="49.0" font-size="17" fill="#2b2620" text-anchor="middle" >舞台奥</text><g class="person" data-performer="FRIAR_LAWRENCE" data-character="FRIAR_LAWRENCE" data-state="" data-u="0.43" data-v="0.53" data-pose="reach"><title>ロレンス修道士</title><circle cx="492.6" cy="338.20000000000005" r="21" fill="#556044" stroke="#fffaf0" stroke-width="3"/><text x="492.6" y="345.2" font-size="19" fill="#fffaf0" text-anchor="middle" font-weight="700">Lo</text><path class="facing" d="M519.6,338.20000000000005l12.0,0.0" stroke="#556044" stroke-width="3" stroke-linecap="round"/></g><g class="person" data-performer="FRIAR_JOHN" data-character="FRIAR_JOHN" data-state="手紙" data-u="0.68" data-v="0.6" data-pose="reach"><title>ジョン修道士／手紙</title><circle cx="697.6" cy="369.0" r="21" fill="#655b4c" stroke="#fffaf0" stroke-width="3"/><text x="697.6" y="376.0" font-size="19" fill="#fffaf0" text-anchor="middle" font-weight="700">Jo</text><path class="facing" d="M670.6,369.0l-12.0,0.0" stroke="#655b4c" stroke-width="3" stroke-linecap="round"/></g><text x="36.0" y="643.0" font-size="16" fill="#2b2620" text-anchor="start" >位置・舞台寸法は検討案。破線の矢印＝移動案／短い線＝向き。</text><text x="1064.0" y="643.0" font-size="17" fill="#2b2620" text-anchor="end" >舞台上 2名</text></g></svg>
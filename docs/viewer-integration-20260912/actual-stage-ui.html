<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>舞台スケッチ — 演者用リンク配置確認</title>
</head>
<body>
  <p>舞台スケッチ本体のUIを読み込んでいます…</p>
  <script>
    fetch('/stage.html', { cache: 'no-store' })
      .then((response) => {
        if (!response.ok) throw new Error('stage.html could not be loaded');
        return response.text();
      })
      .then((source) => {
        const mock = '<script src="/actual-stage-ui.mock.js"><\/script>';
        const css = '<link rel="stylesheet" href="/actual-stage-ui.inject.css">';
        const entry = '<script src="/actual-stage-ui.inject.js"><\/script>';
        const withoutPwa = source.replace(/<script src="stage-pwa\.js[^>]*><\/script>/, '');
        const page = withoutPwa
          .replace('<head>', '<head><base href="/">' + mock)
          .replace('</head>', css + '</head>')
          .replace('</body>', entry + '</body>');
        document.open();
        document.write(page);
        document.close();
      })
      .catch((error) => {
        document.body.textContent = '舞台スケッチ本体を読み込めませんでした: ' + error.message;
      });
  </script>
</body>
</html>

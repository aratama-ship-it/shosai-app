<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>歯車と×の見え方</title>
<style>
 body{margin:0;padding:26px;background:#191512;color:#efe7d6;font:400 12px/1.7 -apple-system,sans-serif;}
 h2{font-size:11px;letter-spacing:.14em;color:#9c823f;font-weight:500;margin:22px 0 8px;}
 .row{display:flex;align-items:center;gap:26px;margin-bottom:6px;}
 .cell{text-align:center;color:#8d8377;font-size:10px;}
 .cell span{display:block;margin-top:6px;}
 svg{color:#cfc5b4;}
 .s15{width:15px;height:15px}.s19{width:19px;height:19px}.s60{width:60px;height:60px}.s120{width:120px;height:120px}
 .emoji{font-size:18px;color:#cfc5b4}.emoji60{font-size:60px;color:#cfc5b4}
 .btn{display:grid;place-items:center;width:44px;height:44px;border:1px solid rgba(240,231,214,.12);background:#15120f;}
</style></head><body>

<h2>■ 新しい歯車（実寸 15px / 19px と、拡大）</h2>
<div class="row">
  <div class="cell"><svg viewBox="0 0 16 16" class="s15" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="4.3" stroke-width="1.3"/><circle cx="8" cy="8" r="1.5" stroke-width="1.3"/><path stroke-width="1.6" d="M8 3.5V1.7M11.9 5.75l1.56-.9M11.9 10.25l1.56.9M8 12.5v1.8M4.1 10.25l-1.56.9M4.1 5.75l-1.56-.9"/></svg><span>15px（スマホ）</span></div>
  <div class="cell"><svg viewBox="0 0 16 16" class="s19" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="4.3" stroke-width="1.3"/><circle cx="8" cy="8" r="1.5" stroke-width="1.3"/><path stroke-width="1.6" d="M8 3.5V1.7M11.9 5.75l1.56-.9M11.9 10.25l1.56.9M8 12.5v1.8M4.1 10.25l-1.56.9M4.1 5.75l-1.56-.9"/></svg><span>19px（ブラウザ）</span></div>
  <div class="cell"><svg viewBox="0 0 16 16" class="s120" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="4.3" stroke-width="1.3"/><circle cx="8" cy="8" r="1.5" stroke-width="1.3"/><path stroke-width="1.6" d="M8 3.5V1.7M11.9 5.75l1.56-.9M11.9 10.25l1.56.9M8 12.5v1.8M4.1 10.25l-1.56.9M4.1 5.75l-1.56-.9"/></svg><span>拡大</span></div>
</div>

<h2>■ 変更前（左=ブラウザ版の多角形 / 右=スマホ版の絵文字「⚙」）</h2>
<div class="row">
  <div class="cell"><svg viewBox="0 0 16 16" class="s19" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.12 3.47L6.78 1.72L9.22 1.72L9.88 3.47L11.58 2.69L13.31 4.42L12.53 6.12L14.28 6.78L14.28 9.22L12.53 9.88L13.31 11.58L11.58 13.31L9.88 12.53L9.22 14.28L6.78 14.28L6.12 12.53L4.42 13.31L2.69 11.58L3.47 9.88L1.72 9.22L1.72 6.78L3.47 6.12L2.69 4.42L4.42 2.69Z"/><circle cx="8" cy="8" r="2.2"/></svg><span>19px</span></div>
  <div class="cell"><svg viewBox="0 0 16 16" class="s120" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.12 3.47L6.78 1.72L9.22 1.72L9.88 3.47L11.58 2.69L13.31 4.42L12.53 6.12L14.28 6.78L14.28 9.22L12.53 9.88L13.31 11.58L11.58 13.31L9.88 12.53L9.22 14.28L6.78 14.28L6.12 12.53L4.42 13.31L2.69 11.58L3.47 9.88L1.72 9.22L1.72 6.78L3.47 6.12L2.69 4.42L4.42 2.69Z"/><circle cx="8" cy="8" r="2.2"/></svg><span>拡大（歯が溶ける）</span></div>
  <div class="cell"><span class="emoji">⚙</span><span>18px</span></div>
  <div class="cell"><span class="emoji60">⚙</span><span>拡大</span></div>
</div>

<h2>■ 既存アイコンと並べる（同じ線の太さ・同じ角の丸め）</h2>
<div class="row">
  <div class="cell"><div class="btn"><svg viewBox="0 0 16 16" class="s15" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.4v11.2M2.4 8h11.2"/><path d="M6.3 4.1 8 2.4l1.7 1.7M6.3 11.9 8 13.6l1.7-1.7"/><path d="M4.1 6.3 2.4 8l1.7 1.7M11.9 6.3 13.6 8l-1.7 1.7"/></svg></div><span>動かす</span></div>
  <div class="cell"><div class="btn"><svg viewBox="0 0 16 16" class="s15" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3.4 12.6 12.4 3.6"/><path d="M7.6 3.6h4.8v4.8"/></svg></div><span>矢印</span></div>
  <div class="cell"><div class="btn"><svg viewBox="0 0 16 16" class="s15" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="4.3" stroke-width="1.3"/><circle cx="8" cy="8" r="1.5" stroke-width="1.3"/><path stroke-width="1.6" d="M8 3.5V1.7M11.9 5.75l1.56-.9M11.9 10.25l1.56.9M8 12.5v1.8M4.1 10.25l-1.56.9M4.1 5.75l-1.56-.9"/></svg></div><span>設定（新）</span></div>
  <div class="cell"><div class="btn"><svg viewBox="0 0 16 16" class="s15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4.4 4.4l7.2 7.2M11.6 4.4l-7.2 7.2"/></svg></div><span>閉じる（新）</span></div>
</div>
<div class="row"><div class="cell"><svg viewBox="0 0 16 16" class="s60" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4.4 4.4l7.2 7.2M11.6 4.4l-7.2 7.2"/></svg><span>×を拡大</span></div></div>
</body></html>
